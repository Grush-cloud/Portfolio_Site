          <button id="panel-close" type="button" aria-label="Close panel">esc</button>

      </aside>
      <div id="boot">
        <pre id="boot-log"></pre>
        <button id="boot-skip" type="button">skip ›</button>

    <main id="cv"><!--CV--></main>
